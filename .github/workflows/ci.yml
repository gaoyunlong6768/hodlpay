name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: Solana program (build + LiteSVM tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v5
      - name: Install Solana CLI (Agave 3.1.10)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            protocol/target
          key: protocol-${{ runner.os }}-${{ hashFiles('protocol/Cargo.lock') }}
      - name: Build program
        run: cargo build-sbf --manifest-path programs/hodlpay/Cargo.toml
      - name: Test
        run: cargo test

  app:
    name: Web app (lint + type-checked build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build (includes type check)
        run: npm run build
